name: Test FreeCAD addon
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: FreeCAD runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          libxcb-randr0 libxcb-render-util0 libxrender1 libxi6 libxrandr2 xvfb xauth
      - name: Install official FreeCAD and checksum-verified Dutchman releases
        run: python3 tests/install_ci.py
      - name: FreeCAD console import and insert
        run: bash tests/freecad_ci.sh
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FreeCAD GUI runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          libxcb-randr0 libxcb-render-util0 libxrender1 libxi6 libxrandr2 xvfb xauth
      - name: Install official FreeCAD and checksum-verified Dutchman releases
        run: python3 tests/install_ci.py
      - name: Capture model and conversion report under Xvfb
        run: bash tests/freecad_ci.sh gui
      - uses: actions/upload-artifact@v4
        with:
          name: dutchman-freecad-screenshots
          path: out/*.png
          if-no-files-found: error
